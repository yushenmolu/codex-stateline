name: Portable Windows Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify release version
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne ('v' + $version)) { throw 'Tag and package version differ.' }
      - name: Build the self-contained single EXE
        shell: powershell
        run: ./scripts/build-portable.ps1
      - name: Verify the actual EXE without Node on PATH
        shell: powershell
        run: ./tests/portable-package.selftest.ps1
      - name: Publish downloadable EXE
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist/Codex-Stateline.exe dist/SHA256SUMS.txt --verify-tag --title "Codex Stateline $env:GITHUB_REF_NAME - Windows x64" --notes-file docs/portable-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
